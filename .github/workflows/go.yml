
name: Go build

on:
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build
      run: go build -v -o sud cmd/cli/main.go

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: short-url-decoder
        path: sud